<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>開工計 WorkTime Pay</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --accent-green: #34c759;
            --accent-green-light: #e8f8ec;
            --text-main: #000000;
            --text-muted: #8e8e93;
            --border-color: #c6c6c8;
            --danger-color: #ff3b30;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }

        /* 📱 主畫面 */
        .main-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 20px calc(40px + env(safe-area-inset-bottom)) 20px;
            box-sizing: border-box;
            background-color: #f9f9fb;
        }

        .header-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding-top: env(safe-area-inset-top);
        }

        .gear-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
        }

        .display-container {
            text-align: center;
            margin-top: -20px;
            width: 100%;
        }

        .earnings-label {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .earnings-amount {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin: 0 0 8px 0;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
        }

        .sub-time {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--accent-green-light);
            color: var(--accent-green);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .status-pill.lunch {
            background-color: #fff4e5;
            color: #ff9500;
        }

        .status-pill.off {
            background-color: #e5e5ea;
            color: #8e8e93;
        }

        /* ☕ 即時記帳卡片 */
        .expense-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 16px 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
        }

        .expense-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
        }

        .expense-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .expense-input-row input, .expense-input-row select {
            border: 1px solid #e5e5ea;
            background: #f8f8fa;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.9rem;
            outline: none;
            font-family: inherit;
        }

        .expense-input-row input[type="text"] { flex: 2; width: 0; }
        .expense-input-row input[type="number"] { flex: 1.2; width: 0; }
        .exp-method-select { flex: 1.5; width: 0; background-color: #e9e9eb !important; border: none !important; }

        .btn-add-exp {
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            flex: 1;
        }

        .expense-list {
            margin-top: 8px;
            max-height: 100px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f5;
        }

        .pay-tag {
            font-size: 0.75rem;
            background: #e5e5ea;
            color: #555;
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 4px;
        }

        /* ⚙️ iOS 設定頁 (完全重構，徹底防錯位) */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: calc(40px + env(safe-area-inset-bottom));
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: rgba(242, 242, 247, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 0.5px solid var(--border-color);
        }

        .settings-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .btn-done {
            background: none;
            border: none;
            color: #007aff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .section-title {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin: 18px 20px 6px 20px;
            font-weight: 600;
        }

        .settings-group {
            background: var(--card-bg);
            border-radius: 12px;
            margin: 0 16px 12px 16px;
            overflow: hidden;
        }

        /* 修復核心：設定行與表單元件分離 */
        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 46px;
            padding: 8px 16px;
            border-bottom: 0.5px solid #e5e5ea;
            font-size: 0.95rem;
        }

        .settings-row:last-child {
            border-bottom: none;
        }

        .settings-row label, .settings-row span {
            font-size: 0.95rem;
            color: var(--text-main);
            flex-shrink: 0;
        }

        /* 專門修復手機端 input / select 爆位問題 */
        .settings-row input[type="text"],
        .settings-row input[type="number"],
        .settings-row input[type="time"],
        .settings-row select {
            width: auto !important;
            max-width: 60% !important;
            margin: 0 !important;
            padding: 4px 8px !important;
            border: none !important;
            background: transparent !important;
            font-size: 0.95rem !important;
            text-align: right !important;
            color: #007aff !important;
            outline: none !important;
            box-shadow: none !important;
            font-family: inherit !important;
        }

        .settings-row input[type="time"] {
            background: #e9e9eb !important;
            border-radius: 8px !important;
            color: var(--text-main) !important;
            padding: 4px 8px !important;
        }

        .settings-row input[type="checkbox"] {
            width: 22px !important;
            height: 22px !important;
            margin: 0 !important;
            accent-color: var(--accent-green);
        }

        .days-selector {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            width: 100%;
        }

        .day-circle {
            width: 36px;
            height: 36px;
            min-width: 36px;
            min-height: 36px;
            border-radius: 50%;
            background: #e5e5ea;
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .day-circle.active {
            background: var(--accent-green);
            color: white;
        }

        .btn-export-csv {
            width: 100%;
            background: #007aff;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-export-csv:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="main-screen">
        <div class="header-bar">
            <button class="gear-btn" onclick="openSettings()">⚙️</button>
        </div>

        <div class="display-container">
            <div class="earnings-label">今日已賺取</div>
            <div class="earnings-amount" id="displayEarnings">HK$0.00</div>
            <div class="sub-time" id="displaySubTime">自 --:-- 起</div>
            <div class="status-pill" id="statusPill">
                <span id="statusDot">🟢</span> <span id="statusText">上班中</span>
            </div>
        </div>

        <div class="expense-card">
            <div class="expense-title">
                <span>返工即時記帳</span>
                <span id="netEarningsText" style="color:var(--accent-green)">淨賺: HK$0.00</span>
            </div>
            <div class="expense-input-row">
                <input type="text" id="expReason" placeholder="項目 (如: 買咖啡)">
                <input type="number" id="expAmt" placeholder="$金額">
            </div>
            <div class="expense-input-row">
                <select id="expMethod" class="exp-method-select">
                    <option value="八達通">🐙 八達通</option>
                    <option value="現金">💵 現金</option>
                    <option value="信用卡">💳 信用卡</option>
                    <option value="PayMe">🔴 PayMe</option>
                    <option value="Alipay">🔵 支付寶</option>
                    <option value="WeChat">🟢 微信支付</option>
                </select>
                <button class="btn-add-exp" onclick="addQuickExpense()">扣減入帳</button>
            </div>
            <div class="expense-list" id="expenseList"></div>
        </div>
    </div>

    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-header">
            <div></div>
            <div class="settings-title">設定</div>
            <button class="btn-done" onclick="closeSettings()">完成</button>
        </div>

        <div class="section-title">薪金與顯示設定</div>
        <div class="settings-group">
            <div class="settings-row">
                <span>計薪方式</span>
                <select id="cfgSalaryMode" onchange="toggleDynamicRows(); saveConfig();">
                    <option value="hourly">時薪 (Hourly)</option>
                    <option value="daily">日薪 (Daily)</option>
                    <option value="monthly">月薪 (Monthly)</option>
                </select>
            </div>
            <div class="settings-row" id="rowMonthlyStartDay">
                <span>月薪起計日</span>
                <select id="cfgMonthlyStartDay" onchange="saveConfig()"></select>
            </div>
            <div class="settings-row">
                <span>薪金金額 (HKD)</span>
                <input type="number" id="cfgSalaryAmt" value="62.22" step="0.01" onchange="saveConfig()">
            </div>
            <div class="settings-row">
                <span>顯示小數位數</span>
                <select id="cfgDecimalPlaces" onchange="saveConfig()">
                    <option value="0">0 位 (例: $575)</option>
                    <option value="1">1 位 (例: $575.8)</option>
                    <option value="2" selected>2 位 (例: $575.86)</option>
                    <option value="3">3 位 (例: $575.862)</option>
                    <option value="4">4 位 (例: $575.8623)</option>
                </select>
            </div>
        </div>

        <div class="section-title">工作時間</div>
        <div class="settings-group">
            <div class="settings-row">
                <span>開工時間</span>
                <input type="time" id="cfgStartTime" value="09:00" onchange="saveConfig()">
            </div>
            <div class="settings-row">
                <span>收工時間</span>
                <input type="time" id="cfgEndTime" value="18:00" onchange="saveConfig()">
            </div>
        </div>

        <div class="section-title">休息時間一 (午休)</div>
        <div class="settings-group">
            <div class="settings-row">
                <span>啟用休息一 (午休)</span>
                <input type="checkbox" id="cfgBreak1Enable" onchange="toggleDynamicRows(); saveConfig();">
            </div>
            <div class="settings-row" id="rowLunchStart">
                <span>午休開始</span>
                <input type="time" id="cfgLunchStart" value="12:30" onchange="saveConfig()">
            </div>
            <div class="settings-row" id="rowLunchEnd">
                <span>午休結束</span>
                <input type="time" id="cfgLunchEnd" value="13:30" onchange="saveConfig()">
            </div>
        </div>

        <div class="section-title">額外休息 (TEA TIME)</div>
        <div class="settings-group">
            <div class="settings-row">
                <span>啟用休息二</span>
                <input type="checkbox" id="cfgBreak2Enable" onchange="toggleDynamicRows(); saveConfig();">
            </div>
            <div class="settings-row" id="rowBreak2Start">
                <span>休息二開始</span>
                <input type="time" id="cfgBreak2Start" value="15:30" onchange="saveConfig()">
            </div>
            <div class="settings-row" id="rowBreak2End">
                <span>休息二結束</span>
                <input type="time" id="cfgBreak2End" value="16:00" onchange="saveConfig()">
            </div>
        </div>

        <div class="section-title">工作日設定</div>
        <div class="settings-group">
            <div class="days-selector">
                <button class="day-circle active" data-day="1" onclick="toggleWorkDay(this)">一</button>
                <button class="day-circle active" data-day="2" onclick="toggleWorkDay(this)">二</button>
                <button class="day-circle active" data-day="3" onclick="toggleWorkDay(this)">三</button>
                <button class="day-circle active" data-day="4" onclick="toggleWorkDay(this)">四</button>
                <button class="day-circle active" data-day="5" onclick="toggleWorkDay(this)">五</button>
                <button class="day-circle" data-day="6" onclick="toggleWorkDay(this)">六</button>
                <button class="day-circle" data-day="0" onclick="toggleWorkDay(this)">日</button>
            </div>
        </div>

        <div class="section-title">數據匯出</div>
        <div style="padding: 0 16px 30px 16px;">
            <button class="btn-export-csv" onclick="exportToAccEasyCSV()">📤 匯出今日數據至《記數易》(CSV)</button>
        </div>
    </div>

    <script>
        // 初始化月薪 1-31 號選單
        const selMonthly = document.getElementById('cfgMonthlyStartDay');
        for (let i = 1; i <= 31; i++) {
            selMonthly.innerHTML += `<option value="${i}">${i} 號</option>`;
        }

        // 初始化 Config
        let config = JSON.parse(localStorage.getItem('WorkTimePay_Config')) || {
            salaryMode: 'hourly',
            monthlyStartDay: 1,
            salaryAmt: 62.22,
            decimalPlaces: 2,
            startTime: '09:00',
            endTime: '18:00',
            break1Enable: true,
            lunchStart: '12:30',
            lunchEnd: '13:30',
            break2Enable: false,
            break2Start: '15:30',
            break2End: '16:00',
            workDays: [1, 2, 3, 4, 5]
        };

        let todayExpenses = JSON.parse(localStorage.getItem('WorkTimePay_TodayExpenses')) || [];
        let currentEarned = 0;

        function openSettings() { document.getElementById('settingsOverlay').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsOverlay').style.display = 'none'; }

        // 動態隱藏/顯示行 (極乾淨)
        function toggleDynamicRows() {
            const mode = document.getElementById('cfgSalaryMode').value;
            document.getElementById('rowMonthlyStartDay').style.display = (mode === 'monthly') ? 'flex' : 'none';

            const b1 = document.getElementById('cfgBreak1Enable').checked;
            document.getElementById('rowLunchStart').style.display = b1 ? 'flex' : 'none';
            document.getElementById('rowLunchEnd').style.display = b1 ? 'flex' : 'none';

            const b2 = document.getElementById('cfgBreak2Enable').checked;
            document.getElementById('rowBreak2Start').style.display = b2 ? 'flex' : 'none';
            document.getElementById('rowBreak2End').style.display = b2 ? 'flex' : 'none';
        }

        function loadConfigToUI() {
            document.getElementById('cfgSalaryMode').value = config.salaryMode;
            document.getElementById('cfgMonthlyStartDay').value = config.monthlyStartDay || 1;
            document.getElementById('cfgSalaryAmt').value = config.salaryAmt;
            document.getElementById('cfgDecimalPlaces').value = config.decimalPlaces !== undefined ? config.decimalPlaces : 2;
            
            document.getElementById('cfgStartTime').value = config.startTime;
            document.getElementById('cfgEndTime').value = config.endTime;

            document.getElementById('cfgBreak1Enable').checked = config.break1Enable !== false;
            document.getElementById('cfgLunchStart').value = config.lunchStart;
            document.getElementById('cfgLunchEnd').value = config.lunchEnd;

            document.getElementById('cfgBreak2Enable').checked = !!config.break2Enable;
            document.getElementById('cfgBreak2Start').value = config.break2Start || '15:30';
            document.getElementById('cfgBreak2End').value = config.break2End || '16:00';

            document.querySelectorAll('.day-circle').forEach(btn => {
                const day = parseInt(btn.dataset.day);
                btn.classList.toggle('active', config.workDays.includes(day));
            });

            toggleDynamicRows();
        }

        function saveConfig() {
            config.salaryMode = document.getElementById('cfgSalaryMode').value;
            config.monthlyStartDay = parseInt(document.getElementById('cfgMonthlyStartDay').value) || 1;
            config.salaryAmt = parseFloat(document.getElementById('cfgSalaryAmt').value) || 0;
            config.decimalPlaces = parseInt(document.getElementById('cfgDecimalPlaces').value);
            
            config.startTime = document.getElementById('cfgStartTime').value;
            config.endTime = document.getElementById('cfgEndTime').value;

            config.break1Enable = document.getElementById('cfgBreak1Enable').checked;
            config.lunchStart = document.getElementById('cfgLunchStart').value;
            config.lunchEnd = document.getElementById('cfgLunchEnd').value;

            config.break2Enable = document.getElementById('cfgBreak2Enable').checked;
            config.break2Start = document.getElementById('cfgBreak2Start').value;
            config.break2End = document.getElementById('cfgBreak2End').value;

            localStorage.setItem('WorkTimePay_Config', JSON.stringify(config));
        }

        function toggleWorkDay(btn) {
            const day = parseInt(btn.dataset.day);
            btn.classList.toggle('active');
            
            const activeDays = Array.from(document.querySelectorAll('.day-circle.active')).map(b => parseInt(b.dataset.day));
            config.workDays = activeDays;
            saveConfig();
        }

        function timeToSeconds(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 3600 + m * 60;
        }

        function getOverlapSeconds(startA, endA, startB, endB) {
            return Math.max(0, Math.min(endA, endB) - Math.max(startA, startB));
        }

        // 📈 實時平滑跳動計數器
        function updateCounter() {
            const now = new Date();
            const currentDay = now.getDay();
            const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + (now.getMilliseconds() / 1000);

            const startSec = timeToSeconds(config.startTime);
            const endSec = timeToSeconds(config.endTime);

            const b1Start = timeToSeconds(config.lunchStart);
            const b1End = timeToSeconds(config.lunchEnd);
            const b1Active = config.break1Enable && (b1End > b1Start);

            const b2Start = timeToSeconds(config.break2Start || '15:30');
            const b2End = timeToSeconds(config.break2End || '16:00');
            const b2Active = config.break2Enable && (b2End > b2Start);

            let totalBreakSec = 0;
            if (b1Active) totalBreakSec += getOverlapSeconds(startSec, endSec, b1Start, b1End);
            if (b2Active) totalBreakSec += getOverlapSeconds(startSec, endSec, b2Start, b2End);

            const totalWorkSec = Math.max(1, (endSec - startSec) - totalBreakSec);

            let ratePerSec = 0;
            if (config.salaryMode === 'hourly') {
                ratePerSec = config.salaryAmt / 3600;
            } else if (config.salaryMode === 'daily') {
                ratePerSec = config.salaryAmt / totalWorkSec;
            } else if (config.salaryMode === 'monthly') {
                ratePerSec = config.salaryAmt / (21.75 * totalWorkSec);
            }

            const isWorkDay = config.workDays.includes(currentDay);
            let elapsedWorkSec = 0;
            let status = 'off';
            let statusLabel = '非工作時間';

            if (!isWorkDay) {
                status = 'off';
                statusLabel = '放假中 🏖️';
            } else if (currentSec < startSec) {
                status = 'off';
                statusLabel = '未開工 ⏳';
            } else if (currentSec >= endSec) {
                status = 'off';
                statusLabel = '已收工 🎉';
                elapsedWorkSec = totalWorkSec;
            } else {
                if (b1Active && currentSec >= b1Start && currentSec < b1End) {
                    status = 'lunch';
                    statusLabel = '午休中 🍱';
                } else if (b2Active && currentSec >= b2Start && currentSec < b2End) {
                    status = 'lunch';
                    statusLabel = '休息中 ☕';
                } else {
                    status = 'working';
                    statusLabel = '上班中 🟢';
                }

                let breakDeduction = 0;
                if (b1Active) breakDeduction += getOverlapSeconds(startSec, currentSec, b1Start, b1End);
                if (b2Active) breakDeduction += getOverlapSeconds(startSec, currentSec, b2Start, b2End);

                elapsedWorkSec = Math.max(0, (currentSec - startSec) - breakDeduction);
            }

            currentEarned = elapsedWorkSec * ratePerSec;
            const decimals = config.decimalPlaces !== undefined ? config.decimalPlaces : 2;

            document.getElementById('displayEarnings').innerText = `HK$${currentEarned.toFixed(decimals)}`;
            document.getElementById('displaySubTime').innerText = `自 ${config.startTime} 起`;

            const pill = document.getElementById('statusPill');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            pill.className = `status-pill ${status}`;
            text.innerText = statusLabel;
            if (status === 'working') dot.innerText = '🟢';
            else if (status === 'lunch') dot.innerText = '🍱';
            else dot.innerText = '🏖️';

            const totalExp = todayExpenses.reduce((sum, e) => sum + e.amt, 0);
            const netEarned = currentEarned - totalExp;
            document.getElementById('netEarningsText').innerText = `淨賺: HK$${netEarned.toFixed(decimals)}`;
        }

        function addQuickExpense() {
            const reason = document.getElementById('expReason').value || '返工消費';
            const amt = parseFloat(document.getElementById('expAmt').value);
            const method = document.getElementById('expMethod').value;
            if (!amt) return;

            todayExpenses.push({ reason, amt, method, time: new Date().toLocaleTimeString() });
            localStorage.setItem('WorkTimePay_TodayExpenses', JSON.stringify(todayExpenses));

            document.getElementById('expReason').value = '';
            document.getElementById('expAmt').value = '';
            renderExpenses();
        }

        function renderExpenses() {
            const list = document.getElementById('expenseList');
            list.innerHTML = '';
            todayExpenses.forEach(e => {
                const methodTag = e.method ? `<span class="pay-tag">${e.method}</span>` : '';
                list.innerHTML += `<div class="expense-item"><span>${e.reason} ${methodTag}</span><span style="color:var(--danger-color)">-$${e.amt}</span></div>`;
            });
        }

        function exportToAccEasyCSV() {
            const todayStr = new Date().toISOString().split('T')[0];
            const decimals = config.decimalPlaces !== undefined ? config.decimalPlaces : 2;
            let csvContent = "\uFEFF內容,金額,日期\n";

            if (currentEarned > 0) {
                csvContent += `工作薪金 (今日結算),${currentEarned.toFixed(decimals)},${todayStr}\n`;
            }

            todayExpenses.forEach(e => {
                const methodStr = e.method ? ` [${e.method}]` : '';
                csvContent += `[返工] ${e.reason}${methodStr},-${e.amt},${todayStr}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `開工計_匯出記數易_${todayStr}.csv`;
            link.click();
        }

        loadConfigToUI();
        renderExpenses();
        setInterval(updateCounter, 30);
        updateCounter();
    </script>
</body>
</html>
