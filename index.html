<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f2f2f7">
  <title>開工計 WorkTime Pay</title>

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <style>
    :root {
      --bg-color: #F2F2F7;
      --card-bg: #FFFFFF;
      --primary: #007AFF;
      --success: #34C759;
      --warning: #FF9500;
      --danger: #FF3B30;
      --text-main: #1C1C1E;
      --text-sub: #8E8E93;
      --border-color: #E5E5EA;
      --radius-lg: 20px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: calc(env(safe-area-inset-top) + 16px) 12px calc(env(safe-area-inset-bottom) + 80px) 12px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .app-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .status-badge {
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-badge.working { background: rgba(52, 199, 89, 0.15); color: var(--success); }
    .status-badge.resting { background: rgba(255, 149, 0, 0.15); color: var(--warning); }
    .status-badge.off { background: rgba(142, 142, 147, 0.15); color: var(--text-sub); }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }

    /* Cards */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    /* Ticker Hero Section */
    .ticker-card {
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .ticker-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .ticker-amount {
      font-size: 44px;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      margin-bottom: 12px;
      line-height: 1.1;
    }

    .ticker-amount .currency {
      font-size: 28px;
      font-weight: 600;
      margin-right: 4px;
    }

    .rate-pill {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      background: rgba(0, 122, 255, 0.1);
      padding: 4px 12px;
      border-radius: 12px;
      font-variant-numeric: tabular-nums;
    }

    /* Progress Bar */
    .progress-container {
      margin-top: 20px;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .progress-bar-bg {
      height: 8px;
      background: #E5E5EA;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--success);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 4px;
    }

    /* Sub Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      padding: 14px;
    }

    .stat-title {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.earned { color: var(--success); }
    .stat-value.spent { color: var(--danger); }

    /* Forms & Inputs */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 15px;
      background-color: #FAFAFC;
      color: var(--text-main);
      outline: none;
      transition: border 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background-color: #FFFFFF;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-md);
      background: var(--primary);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      opacity: 0.8;
      transform: scale(0.98);
    }

    .btn-secondary {
      background: #E5E5EA;
      color: var(--text-main);
    }

    .btn-danger {
      background: rgba(255, 59, 48, 0.1);
      color: var(--danger);
    }

    /* List View for Expenses & Breaks */
    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
      max-height: 250px;
      overflow-y: auto;
    }

    .expense-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #FAFAFC;
      border-radius: 10px;
      font-size: 14px;
    }

    .expense-info {
      display: flex;
      flex-direction: column;
    }

    .expense-title {
      font-weight: 600;
    }

    .expense-meta {
      font-size: 11px;
      color: var(--text-sub);
    }

    .expense-amount {
      font-weight: 700;
      color: var(--danger);
      font-variant-numeric: tabular-nums;
    }

    .break-item {
      display: flex;
      gap: 8px;
      align-items: center;
      background: #FAFAFC;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    /* Sortable List (For Payment Methods) */
    .sortable-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FAFAFC;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 15px;
      cursor: grab;
      transition: background 0.2s;
    }
    
    .sortable-item:active {
      cursor: grabbing;
      background: #F2F2F7;
    }

    .delete-btn {
      color: var(--danger);
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    /* Bottom Navigation */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-around;
      padding: 10px 0 24px 0;
      z-index: 100;
    }

    .tab-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-sub);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      width: 33%;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 28px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #E5E5EA;
      transition: .3s;
      border-radius: 28px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 24px;
      width: 24px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    input:checked + .slider { background-color: var(--success); }
    input:checked + .slider:before { transform: translateX(22px); }

    .days-picker {
      display: flex;
      justify-content: space-between;
      gap: 4px;
      margin-top: 6px;
    }

    .day-chip {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      background: #FAFAFC;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .day-chip.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header -->
    <header>
      <div class="app-title">開工計 WorkTime Pay</div>
      <div id="statusBadge" class="status-badge off">
        <span class="status-dot"></span>
        <span id="statusText">已收工</span>
      </div>
    </header>

    <!-- TAB 1: Realtime Ticker Dashboard -->
    <div id="tab-dashboard" class="tab-content active">
      <div class="card ticker-card">
        <div class="ticker-label">今日累積淨賺 (Net Earned)</div>
        <div class="ticker-amount">
          <span class="currency">$</span><span id="netAmount">0.00</span>
        </div>
        <div class="rate-pill">
          ⚡ 秒薪: $<span id="perSecondRate">0.0000</span> / 秒
        </div>

        <div class="progress-container">
          <div class="progress-info">
            <span>今日工時進度</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div id="progressBarFill" class="progress-bar-fill"></div>
          </div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="card stat-card">
          <div class="stat-title">今日毛薪金 (Gross)</div>
          <div id="grossAmount" class="stat-value earned">$0.00</div>
        </div>
        <div class="card stat-card">
          <div class="stat-title">今日返工開支 (Expenses)</div>
          <div id="todayExpense" class="stat-value spent">$0.00</div>
        </div>
      </div>

      <!-- 開支紀錄 -->
      <div class="card">
        <h3 style="font-size: 16px;">📋 今日開支紀錄</h3>
        <div id="expenseList" class="expense-list">
          <!-- Expense items will populate here -->
        </div>
      </div>
    </div>

    <!-- TAB 2: Work Expense Logger -->
    <div id="tab-expense" class="tab-content">
      <div class="card">
        <h3 style="margin-bottom: 12px; font-size: 16px;">➕ 新增返工開支</h3>
        <form id="expenseForm">
          <!-- 已交換位置：備註喺頂，金額同支付方式喺下面 -->
          <div class="form-group">
            <label>備註 / 項目</label>
            <input type="text" id="expenseNote" placeholder="例如：搭車、食午餐">
          </div>
          <div class="input-row form-group">
            <div style="flex: 1;">
              <label>支付方式</label>
              <select id="expensePayment">
                <!-- 將由 JS 動態生成 -->
              </select>
            </div>
            <div style="flex: 1.5;">
              <label>金額 ($)</label>
              <input type="number" id="expenseAmount" step="0.1" placeholder="例如：4.5 或 60" required>
            </div>
          </div>
          <button type="submit" class="btn">記帳落袋</button>
        </form>
      </div>
    </div>

    <!-- TAB 3: Settings -->
    <div id="tab-settings" class="tab-content">
      <div class="card">
        <h3 style="margin-bottom: 14px; font-size: 16px;">⚙️ 薪酬與工時設定</h3>
        
        <div class="form-group">
          <label>計薪方式</label>
          <select id="salaryType">
            <option value="monthly">月薪 (Monthly)</option>
            <option value="daily">日薪 (Daily)</option>
            <option value="hourly">時薪 (Hourly)</option>
          </select>
        </div>

        <div class="form-group">
          <label id="salaryAmountLabel">金額 ($)</label>
          <input type="number" id="salaryAmount" value="25000">
        </div>

        <div class="input-row form-group">
          <div>
            <label>開工時間</label>
            <input type="time" id="workStart" value="09:00">
          </div>
          <div>
            <label>收工時間</label>
            <input type="time" id="workEnd" value="18:00">
          </div>
        </div>

        <div class="form-group">
          <label>工作日 (工作天設定)</label>
          <div class="days-picker" id="daysPicker">
            <div class="day-chip active" data-day="1">一</div>
            <div class="day-chip active" data-day="2">二</div>
            <div class="day-chip active" data-day="3">三</div>
            <div class="day-chip active" data-day="4">四</div>
            <div class="day-chip active" data-day="5">五</div>
            <div class="day-chip" data-day="6">六</div>
            <div class="day-chip" data-day="0">日</div>
          </div>
        </div>

        <!-- 自訂多重休息時段 -->
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <label style="margin: 0;">休息時段 (自動暫停跳錢)</label>
            <button id="addBreakBtn" type="button" class="btn btn-secondary" style="padding: 4px 10px; width: auto; font-size: 12px; font-weight: 600;">+ 新增</button>
          </div>
          <div id="breaksContainer" style="display:flex; flex-direction:column; gap:8px;">
            <!-- Break Items will populate here -->
          </div>
        </div>

        <div class="form-group">
          <label>顯示小數位數</label>
          <select id="decimalPlaces">
            <option value="0">0位 ($123)</option>
            <option value="1">1位 ($123.4)</option>
            <option value="2" selected>2位 ($123.45)</option>
            <option value="3">3位 ($123.456)</option>
            <option value="4">4位 ($123.4567)</option>
          </select>
        </div>

        <button id="saveSettingsBtn" class="btn" style="margin-top: 8px;">儲存基礎設定</button>
      </div>

      <!-- 自訂支付方式卡片 -->
      <div class="card">
        <h3 style="margin-bottom: 14px; font-size: 16px;">💳 支付方式排序</h3>
        <div id="paymentListContainer" style="display:flex; flex-direction:column; gap:8px; margin-bottom: 16px;">
          <!-- Payment items will populate here -->
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <input type="text" id="newPaymentInput" placeholder="例如：💳 信用卡" style="background-color: #FAFAFC;">
          <button type="button" id="addPaymentBtn" class="btn" style="padding: 12px; font-size: 15px;">新增支付方式</button>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom: 12px; font-size: 16px;">📦 數據備份與管理</h3>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button id="exportCsvBtn" class="btn btn-secondary">匯出 CSV 備份 (相容《記數易》)</button>
          <button id="clearDataBtn" class="btn btn-danger">重置所有本地資料</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Bottom Navigation Bar -->
  <nav class="tab-bar">
    <button class="tab-btn active" data-tab="tab-dashboard">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
      即時跳錢
    </button>
    <button class="tab-btn" data-tab="tab-expense">
      <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      返工記帳
    </button>
    <button class="tab-btn" data-tab="tab-settings">
      <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      設定
    </button>
  </nav>

  <script>
    // App State Configuration
    const defaultConfig = {
      salaryType: 'monthly',
      salaryAmount: 25000,
      workStart: '09:00',
      workEnd: '18:00',
      workDays: [1, 2, 3, 4, 5],
      decimalPlaces: 2,
      breaks: [
        { id: 'b1', start: '12:00', end: '13:00', enabled: true }
      ],
      paymentMethods: ['八達通', 'PayMe', '現金', '信用卡']
    };

    let savedConfig = JSON.parse(localStorage.getItem('wtp_config'));
    
    // Migration
    if (savedConfig && savedConfig.lunchEnabled !== undefined) {
      savedConfig.breaks = [{ id: 'b1', start: savedConfig.lunchStart || '12:00', end: savedConfig.lunchEnd || '13:00', enabled: savedConfig.lunchEnabled }];
      delete savedConfig.lunchEnabled;
      delete savedConfig.lunchStart;
      delete savedConfig.lunchEnd;
    }
    
    let config = { ...defaultConfig, ...savedConfig };
    if (!config.breaks) config.breaks = defaultConfig.breaks;
    if (!config.paymentMethods) config.paymentMethods = defaultConfig.paymentMethods;
    
    let expenses = JSON.parse(localStorage.getItem('wtp_expenses')) || [];

    function parseTime(timeStr) {
      const [h, m] = timeStr.split(':').map(Number);
      return h * 3600 + m * 60;
    }

    function getTodayKey() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function saveConfig() {
      localStorage.setItem('wtp_config', JSON.stringify(config));
    }

    function saveExpenses() {
      localStorage.setItem('wtp_expenses', JSON.stringify(expenses));
    }

    function getValidBreaks() {
      const startSec = parseTime(config.workStart);
      const endSec = parseTime(config.workEnd);
      return config.breaks
        .filter(b => b.enabled)
        .map(b => ({ start: parseTime(b.start), end: parseTime(b.end) }))
        .filter(b => b.start >= startSec && b.end <= endSec && b.end > b.start)
        .sort((a, b) => a.start - b.start);
    }

    function getWorkedSeconds(currentTimeSec, startSec, endSec, validBreaks) {
      if (currentTimeSec <= startSec) return 0;
      let worked = 0;
      let currentPos = startSec;
      let cappedTime = Math.min(currentTimeSec, endSec);

      for (let b of validBreaks) {
        if (cappedTime >= b.end) {
          worked += Math.max(0, b.start - currentPos);
          currentPos = b.end;
        } else if (cappedTime >= b.start && cappedTime < b.end) {
          worked += Math.max(0, b.start - currentPos);
          currentPos = cappedTime;
          break;
        } else {
          break;
        }
      }
      worked += Math.max(0, cappedTime - currentPos);
      return worked;
    }

    function tick() {
      const now = new Date();
      const currentDay = now.getDay();
      const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;

      const startSec = parseTime(config.workStart);
      const endSec = parseTime(config.workEnd);
      const validBreaks = getValidBreaks();
      
      const totalWorkSec = getWorkedSeconds(endSec, startSec, endSec, validBreaks);

      let dailySalary = 0;
      if (config.salaryType === 'monthly') {
        dailySalary = config.salaryAmount / 21.75;
      } else if (config.salaryType === 'daily') {
        dailySalary = config.salaryAmount;
      } else if (config.salaryType === 'hourly') {
        dailySalary = config.salaryAmount * (totalWorkSec / 3600);
      }

      const ratePerSecond = totalWorkSec > 0 ? dailySalary / totalWorkSec : 0;

      const badge = document.getElementById('statusBadge');
      const statusText = document.getElementById('statusText');

      let grossEarned = 0;
      const isWorkDay = config.workDays.includes(currentDay);

      let isCurrentlyResting = false;
      for (let b of validBreaks) {
        if (currentSec >= b.start && currentSec < b.end) {
          isCurrentlyResting = true;
          break;
        }
      }

      if (!isWorkDay) {
        badge.className = 'status-badge off';
        statusText.innerText = '休假中';
      } else if (currentSec < startSec) {
        badge.className = 'status-badge off';
        statusText.innerText = '未開工';
      } else if (currentSec >= endSec) {
        badge.className = 'status-badge off';
        statusText.innerText = '已收工';
      } else if (isCurrentlyResting) {
        badge.className = 'status-badge resting';
        statusText.innerText = '休息中 ☕';
      } else {
        badge.className = 'status-badge working';
        statusText.innerText = '上班中 🔥';
      }

      if (isWorkDay) {
        grossEarned = getWorkedSeconds(currentSec, startSec, endSec, validBreaks) * ratePerSecond;
      }

      const todayKey = getTodayKey();
      const todayExpensesTotal = expenses
        .filter(item => item.date === todayKey)
        .reduce((sum, item) => sum + item.amount, 0);

      const netEarned = grossEarned - todayExpensesTotal;
      const decimals = parseInt(config.decimalPlaces);

      document.getElementById('netAmount').innerText = netEarned.toFixed(decimals);
      document.getElementById('grossAmount').innerText = '$' + grossEarned.toFixed(2);
      document.getElementById('todayExpense').innerText = '$' + todayExpensesTotal.toFixed(2);
      document.getElementById('perSecondRate').innerText = ratePerSecond.toFixed(4);

      let progressPct = 0;
      if (isWorkDay && endSec > startSec) {
        if (currentSec >= endSec) progressPct = 100;
        else if (currentSec > startSec) {
          progressPct = Math.min(100, Math.max(0, ((currentSec - startSec) / (endSec - startSec)) * 100));
        }
      }
      document.getElementById('progressPercent').innerText = `${progressPct.toFixed(1)}%`;
      document.getElementById('progressBarFill').style.width = `${progressPct}%`;
    }

    // --- Expense Tracking ---
    function renderExpenseList() {
      const todayKey = getTodayKey();
      const listEl = document.getElementById('expenseList');
      const todayItems = expenses.filter(item => item.date === todayKey);

      if (todayItems.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; color:#8E8E93; padding:12px; font-size:13px;">今日暫無記帳紀錄</div>';
        return;
      }

      listEl.innerHTML = todayItems.map((item) => `
        <div class="expense-item">
          <div class="expense-info">
            <span class="expense-title">${item.note || item.payment}</span>
            <span class="expense-meta">${item.time} · ${item.payment}</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="expense-amount">-$${item.amount.toFixed(2)}</span>
            <button style="color:#FF3B30; background:none; border:none; padding:4px; font-size:16px; cursor:pointer;" onclick="deleteExpense('${item.id}')">✕</button>
          </div>
        </div>
      `).join('');
    }

    function deleteExpense(id) {
      expenses = expenses.filter(item => item.id !== id);
      saveExpenses();
      renderExpenseList();
    }

    document.getElementById('expenseForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('expenseAmount').value);
      const payment = document.getElementById('expensePayment').value;
      const note = document.getElementById('expenseNote').value;
      const now = new Date();

      if (isNaN(amount) || amount <= 0) return;

      const newExpense = {
        id: Date.now().toString(),
        date: getTodayKey(),
        time: `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
        amount,
        payment,
        note
      };

      expenses.unshift(newExpense);
      saveExpenses();
      renderExpenseList();

      document.getElementById('expenseAmount').value = '';
      document.getElementById('expenseNote').value = '';
      document.querySelector('[data-tab="tab-dashboard"]').click();
    });


    // --- Payment Methods Manager (Drag & Drop + Add/Remove) ---
    let draggedIndex = null;

    function renderPaymentMethods() {
      const container = document.getElementById('paymentListContainer');
      container.innerHTML = config.paymentMethods.map((p, index) => `
        <div class="sortable-item" draggable="true" data-index="${index}">
          <div style="display: flex; align-items: center; gap: 12px; pointer-events: none;">
            <span style="color: #C7C7CC; font-weight: bold; font-size: 18px;">≡</span>
            <span style="font-weight: 500;">${p}</span>
          </div>
          <button type="button" class="delete-btn" data-index="${index}">×</button>
        </div>
      `).join('');

      document.getElementById('expensePayment').innerHTML = 
        config.paymentMethods.map(p => `<option value="${p}">${p}</option>`).join('');

      container.querySelectorAll('.sortable-item').forEach(item => {
        item.addEventListener('dragstart', (e) => {
          draggedIndex = parseInt(item.dataset.index);
          setTimeout(() => item.style.opacity = '0.5', 0);
        });
        item.addEventListener('dragover', (e) => e.preventDefault());
        item.addEventListener('drop', (e) => {
          e.preventDefault();
          const targetIndex = parseInt(item.dataset.index);
          if (draggedIndex !== null && draggedIndex !== targetIndex) {
            const movedItem = config.paymentMethods.splice(draggedIndex, 1)[0];
            config.paymentMethods.splice(targetIndex, 0, movedItem);
            saveConfig();
            renderPaymentMethods();
          }
        });
        item.addEventListener('dragend', () => {
          item.style.opacity = '1';
          draggedIndex = null;
        });
      });
    }

    document.getElementById('paymentListContainer').addEventListener('click', (e) => {
      if (e.target.classList.contains('delete-btn')) {
        const index = parseInt(e.target.dataset.index);
        config.paymentMethods.splice(index, 1);
        saveConfig();
        renderPaymentMethods();
      }
    });

    document.getElementById('addPaymentBtn').addEventListener('click', () => {
      const input = document.getElementById('newPaymentInput');
      const val = input.value.trim();
      if (val) {
        config.paymentMethods.push(val);
        input.value = '';
        saveConfig();
        renderPaymentMethods();
      }
    });


    // --- Break Times Manager ---
    function renderBreaks(breaksArray) {
      const container = document.getElementById('breaksContainer');
      container.innerHTML = breaksArray.map(b => `
        <div class="break-item" data-id="${b.id}">
          <input type="time" class="break-start" value="${b.start}" style="padding: 6px; font-size: 14px; flex: 1;">
          <span style="color: var(--text-sub);">-</span>
          <input type="time" class="break-end" value="${b.end}" style="padding: 6px; font-size: 14px; flex: 1;">
          <label class="switch" style="transform: scale(0.8); margin: 0 4px;">
            <input type="checkbox" class="break-enabled" ${b.enabled ? 'checked' : ''}>
            <span class="slider"></span>
          </label>
          <button type="button" class="btn-danger remove-break" style="padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer;">✕</button>
        </div>
      `).join('');
    }

    document.getElementById('addBreakBtn').addEventListener('click', () => {
      const container = document.getElementById('breaksContainer');
      const newId = Date.now().toString();
      const html = `
        <div class="break-item" data-id="${newId}">
          <input type="time" class="break-start" value="12:00" style="padding: 6px; font-size: 14px; flex: 1;">
          <span style="color: var(--text-sub);">-</span>
          <input type="time" class="break-end" value="13:00" style="padding: 6px; font-size: 14px; flex: 1;">
          <label class="switch" style="transform: scale(0.8); margin: 0 4px;">
            <input type="checkbox" class="break-enabled" checked>
            <span class="slider"></span>
          </label>
          <button type="button" class="btn-danger remove-break" style="padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer;">✕</button>
        </div>
      `;
      container.insertAdjacentHTML('beforeend', html);
    });

    document.getElementById('breaksContainer').addEventListener('click', (e) => {
      if (e.target.classList.contains('remove-break')) {
        e.target.closest('.break-item').remove();
      }
    });

    // --- Core Settings Manager ---
    function loadSettingsToForm() {
      document.getElementById('salaryType').value = config.salaryType;
      document.getElementById('salaryAmount').value = config.salaryAmount;
      document.getElementById('workStart').value = config.workStart;
      document.getElementById('workEnd').value = config.workEnd;
      document.getElementById('decimalPlaces').value = config.decimalPlaces;

      renderBreaks(config.breaks);
      renderPaymentMethods();

      document.querySelectorAll('.day-chip').forEach(chip => {
        const day = parseInt(chip.dataset.day);
        if (config.workDays.includes(day)) chip.classList.add('active');
        else chip.classList.remove('active');
      });
    }

    document.querySelectorAll('.day-chip').forEach(chip => {
      chip.addEventListener('click', () => chip.classList.toggle('active'));
    });

    document.getElementById('saveSettingsBtn').addEventListener('click', () => {
      config.salaryType = document.getElementById('salaryType').value;
      config.salaryAmount = parseFloat(document.getElementById('salaryAmount').value) || 0;
      config.workStart = document.getElementById('workStart').value;
      config.workEnd = document.getElementById('workEnd').value;
      config.decimalPlaces = parseInt(document.getElementById('decimalPlaces').value);

      const newBreaks = [];
      document.querySelectorAll('.break-item').forEach(item => {
        newBreaks.push({
          id: item.dataset.id,
          start: item.querySelector('.break-start').value,
          end: item.querySelector('.break-end').value,
          enabled: item.querySelector('.break-enabled').checked
        });
      });
      config.breaks = newBreaks;

      const activeDays = [];
      document.querySelectorAll('.day-chip.active').forEach(chip => {
        activeDays.push(parseInt(chip.dataset.day));
      });
      config.workDays = activeDays;

      saveConfig();
      alert('✅ 基礎設定已成功更新！');
    });

    // --- Utility Functions ---
    document.getElementById('exportCsvBtn').addEventListener('click', () => {
      if (expenses.length === 0) {
        alert('目前無任何記帳紀錄可供匯出。');
        return;
      }
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
      csvContent += "日期,時間,支付方式,金額,備註\n";
      expenses.forEach(item => {
        csvContent += `"${item.date}","${item.time}","${item.payment}","${item.amount}","${item.note || ''}"\n`;
      });
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `WorkTimePay_Backup_${getTodayKey()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    document.getElementById('clearDataBtn').addEventListener('click', () => {
      if (confirm('確定要清除所有本地儲存嘅資料？（此動作無法復原）')) {
        localStorage.clear();
        config = { ...defaultConfig };
        expenses = [];
        loadSettingsToForm();
        renderExpenseList();
        alert('資料已清空！');
      }
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // --- PWA Offline Support (Inline Service Worker) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => {
            console.log('✅ PWA Service Worker 註冊成功！', reg.scope);
          })
          .catch((err) => {
            console.error('❌ Service Worker 註冊失敗:', err);
          });
      });
    }

    // Initializations
    loadSettingsToForm();
    renderExpenseList();
    setInterval(tick, 30);
  </script>
</body>
</html>
