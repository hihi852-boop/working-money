<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>開工計 WorkTime Pay</title>
    <style>
        :root {
            --bg-color: #f7f7f9;
            --card-bg: #ffffff;
            --accent-green: #34c759;
            --accent-green-light: #e8f8ec;
            --text-main: #1c1c1e;
            --text-muted: #8e8e93;
            --border-color: #e5e5ea;
            --danger-color: #ff3b30;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
        }

        /* 📱 主畫面比例調校 */
        .main-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 20px 24px 40px 24px;
            box-sizing: border-box;
            background-color: #f9f9fb;
        }

        .header-bar {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding-top: 10px;
        }

        .gear-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px;
            transition: opacity 0.2s;
        }

        .gear-btn:active {
            opacity: 0.5;
        }

        .display-container {
            text-align: center;
            margin-top: -30px;
            width: 100%;
        }

        .earnings-label {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        /* 📈 跳動數字與等寬對齊 */
        .earnings-amount {
            font-size: 3.4rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin: 0 0 10px 0;
            font-variant-numeric: tabular-nums;
            color: var(--text-main);
            transition: transform 0.05s ease;
        }

        .sub-time {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 400;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--accent-green-light);
            color: var(--accent-green);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            font-weight: 600;
        }

        .status-pill.lunch {
            background-color: #fff4e5;
            color: #ff9500;
        }

        .status-pill.off {
            background-color: #e5e5ea;
            color: #8e8e93;
        }

        /* ☕ 返工即時記帳 卡片 */
        .expense-card {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 22px;
            padding: 18px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            box-sizing: border-box;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .expense-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .expense-input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        .expense-input-row input, .expense-input-row select {
            border: 1px solid var(--border-color);
            background: #f8f8fa;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 0.9rem;
            outline: none;
            box-sizing: border-box;
            font-family: inherit;
        }

        .expense-input-row input[type="text"] { flex: 2; }
        .expense-input-row input[type="number"] { flex: 1.2; }
        .exp-method-select { flex: 1.5; background-color: #e9e9eb !important; border: none !important; font-weight: 500; }

        .btn-add-exp {
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0 16px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            flex: 1;
        }

        .expense-list {
            margin-top: 10px;
            max-height: 110px;
            overflow-y: auto;
            font-size: 0.85rem;
        }

        .expense-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            border-bottom: 1px solid #f0f0f5;
        }

        .pay-tag {
            font-size: 0.75rem;
            background: #e5e5ea;
            color: #555;
            padding: 2px 6px;
            border-radius: 6px;
            margin-left: 6px;
        }

        /* ⚙️ 設定頁 Overlay (iOS 原生風格) */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            z-index: 1000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-color);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .settings-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .btn-done {
            background: none;
            border: none;
            color: #007aff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }

        .section-title {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin: 18px 25px 8px 25px;
            font-weight: 600;
        }

        .settings-group {
            background: var(--card-bg);
            border-radius: 16px;
            margin: 0 20px 10px 20px;
            overflow: hidden;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }

        .settings-row:last-child {
            border-bottom: none;
        }

        .settings-row select, .settings-row input {
            border: none;
            background: none;
            font-size: 0.95rem;
            text-align: right;
            outline: none;
            color: #007aff;
            font-family: inherit;
        }

        .time-picker-box {
            background: #e9e9eb;
            padding: 4px 10px;
            border-radius: 8px;
            color: var(--text-main) !important;
        }

        /* 工作日按鈕粒 (M T W T F S S) */
        .days-selector {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--card-bg);
        }

        .day-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e5e5ea;
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .day-circle.active {
            background: var(--accent-green);
            color: white;
        }

        .btn-export-csv {
            width: 100%;
            background: #007aff;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-export-csv:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="main-screen">
        <div class="header-bar">
            <button class="gear-btn" onclick="openSettings()">⚙️</button>
        </div>

        <div class="display-container">
            <div class="earnings-label">今日已賺取</div>
            <div class="earnings-amount" id="displayEarnings">HK$0.00</div>
            <div class="sub-time" id="displaySubTime">自 --:-- 起</div>
            <div class="status-pill" id="statusPill">
                <span id="statusDot">🟢</span> <span id="statusText">上班中</span>
            </div>
        </div>

        <div class="expense-card">
            <div class="expense-title">
                <span>返工即時記帳</span>
                <span id="netEarningsText" style="color:var(--accent-green)">淨賺: HK$0.0</span>
            </div>
            <div class="expense-input-row">
                <input type="text" id="expReason" placeholder="項目 (如: 買咖啡)">
                <input type="number" id="expAmt" placeholder="$金額">
            </div>
            <div class="expense-input-row">
                <select id="expMethod" class="exp-method-select">
                    <option value="八達通">🐙 八達通</option>
                    <option value="現金">💵 現金</option>
                    <option value="信用卡">💳 信用卡</option>
                    <option value="PayMe">🔴 PayMe</option>
                    <option value="Alipay">🔵 支付寶</option>
                    <option value="WeChat">🟢 微信支付</option>
                </select>
                <button class="btn-add-exp" onclick="addQuickExpense()">扣減入帳</button>
            </div>
            <div class="expense-list" id="expenseList"></div>
        </div>
    </div>

    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-header">
            <div></div>
            <div class="settings-title">設定</div>
            <button class="btn-done" onclick="closeSettings()">完成</button>
        </div>

        <div class="section-title">薪金設定</div>
        <div class="settings-group">
            <div class="settings-row">
                <span>計薪方式</span>
                <select id="cfgSalaryMode" onchange="saveConfig()">
                    <option value="hourly">時薪 (Hourly)</option>
                    <option value="daily">日薪 (Daily)</option>
                    <option value="monthly">月薪 (Monthly)</option>
                </select>
            </div>
            <div class="settings-row">
                <span>金額 (HKD)</span>
                <input type="number" id="cfgSalaryAmt" value="62.22" step="0.01" onchange="saveConfig()">
            </div>
        </div>

        <div class="section-title">工作時間與放飯</div>
        <div class="settings-group">
            <div class="settings-row">
                <span>開工時間</span>
                <input type="time" class="time-picker-box" id="cfgStartTime" value="09:00" onchange="saveConfig()">
            </div>
            <div class="settings-row">
                <span>收工時間</span>
                <input type="time" class="time-picker-box" id="cfgEndTime" value="18:00" onchange="saveConfig()">
            </div>
            <div class="settings-row">
                <span>午休開始</span>
                <input type="time" class="time-picker-box" id="cfgLunchStart" value="12:30" onchange="saveConfig()">
            </div>
            <div class="settings-row">
                <span>午休結束</span>
                <input type="time" class="time-picker-box" id="cfgLunchEnd" value="13:30" onchange="saveConfig()">
            </div>
        </div>

        <div class="section-title">工作日設定</div>
        <div class="settings-group">
            <div class="days-selector">
                <button class="day-circle active" data-day="1" onclick="toggleWorkDay(this)">一</button>
                <button class="day-circle active" data-day="2" onclick="toggleWorkDay(this)">二</button>
                <button class="day-circle active" data-day="3" onclick="toggleWorkDay(this)">三</button>
                <button class="day-circle active" data-day="4" onclick="toggleWorkDay(this)">四</button>
                <button class="day-circle active" data-day="5" onclick="toggleWorkDay(this)">五</button>
                <button class="day-circle" data-day="6" onclick="toggleWorkDay(this)">六</button>
                <button class="day-circle" data-day="0" onclick="toggleWorkDay(this)">日</button>
            </div>
        </div>

        <div class="section-title">數據匯出</div>
        <div style="padding: 0 20px 30px 20px;">
            <button class="btn-export-csv" onclick="exportToAccEasyCSV()">📤 匯出今日數據至《記數易》(CSV)</button>
        </div>
    </div>

    <script>
        // 初始化設定
        let config = JSON.parse(localStorage.getItem('WorkTimePay_Config')) || {
            salaryMode: 'hourly',
            salaryAmt: 62.22,
            startTime: '09:00',
            endTime: '18:00',
            lunchStart: '12:30',
            lunchEnd: '13:30',
            workDays: [1, 2, 3, 4, 5] // 1=Mon, ..., 0=Sun
        };

        let todayExpenses = JSON.parse(localStorage.getItem('WorkTimePay_TodayExpenses')) || [];
        let currentEarned = 0;

        function openSettings() { document.getElementById('settingsOverlay').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsOverlay').style.display = 'none'; }

        function loadConfigToUI() {
            document.getElementById('cfgSalaryMode').value = config.salaryMode;
            document.getElementById('cfgSalaryAmt').value = config.salaryAmt;
            document.getElementById('cfgStartTime').value = config.startTime;
            document.getElementById('cfgEndTime').value = config.endTime;
            document.getElementById('cfgLunchStart').value = config.lunchStart;
            document.getElementById('cfgLunchEnd').value = config.lunchEnd;

            document.querySelectorAll('.day-circle').forEach(btn => {
                const day = parseInt(btn.dataset.day);
                btn.classList.toggle('active', config.workDays.includes(day));
            });
        }

        function saveConfig() {
            config.salaryMode = document.getElementById('cfgSalaryMode').value;
            config.salaryAmt = parseFloat(document.getElementById('cfgSalaryAmt').value) || 0;
            config.startTime = document.getElementById('cfgStartTime').value;
            config.endTime = document.getElementById('cfgEndTime').value;
            config.lunchStart = document.getElementById('cfgLunchStart').value;
            config.lunchEnd = document.getElementById('cfgLunchEnd').value;

            localStorage.setItem('WorkTimePay_Config', JSON.stringify(config));
        }

        function toggleWorkDay(btn) {
            const day = parseInt(btn.dataset.day);
            btn.classList.toggle('active');
            
            const activeDays = Array.from(document.querySelectorAll('.day-circle.active')).map(b => parseInt(b.dataset.day));
            config.workDays = activeDays;
            saveConfig();
        }

        function timeToSeconds(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 3600 + m * 60;
        }

        // 📈 實時平滑跳動計數器 (30毫秒高清渲染)
        function updateCounter() {
            const now = new Date();
            const currentDay = now.getDay();
            const currentSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + (now.getMilliseconds() / 1000);

            const startSec = timeToSeconds(config.startTime);
            const endSec = timeToSeconds(config.endTime);
            const lunchStartSec = timeToSeconds(config.lunchStart);
            const lunchEndSec = timeToSeconds(config.lunchEnd);

            const lunchDuration = Math.max(0, lunchEndSec - lunchStartSec);
            const totalWorkSec = Math.max(1, (endSec - startSec) - lunchDuration);

            // 每秒跳錢率
            let ratePerSec = 0;
            if (config.salaryMode === 'hourly') {
                ratePerSec = config.salaryAmt / 3600;
            } else if (config.salaryMode === 'daily') {
                ratePerSec = config.salaryAmt / totalWorkSec;
            } else if (config.salaryMode === 'monthly') {
                ratePerSec = config.salaryAmt / (21.75 * totalWorkSec);
            }

            const isWorkDay = config.workDays.includes(currentDay);
            let elapsedWorkSec = 0;
            let status = 'off';
            let statusLabel = '非工作時間';

            if (!isWorkDay) {
                status = 'off';
                statusLabel = '放假中 🏖️';
            } else if (currentSec < startSec) {
                status = 'off';
                statusLabel = '未開工 ⏳';
            } else if (currentSec >= endSec) {
                status = 'off';
                statusLabel = '已收工 🎉';
                elapsedWorkSec = totalWorkSec;
            } else {
                // 返工時間內
                if (currentSec >= lunchStartSec && currentSec < lunchEndSec) {
                    status = 'lunch';
                    statusLabel = '午休中 🍱';
                    elapsedWorkSec = lunchStartSec - startSec;
                } else if (currentSec >= lunchEndSec) {
                    status = 'working';
                    statusLabel = '上班中 🟢';
                    elapsedWorkSec = (currentSec - startSec) - lunchDuration;
                } else {
                    status = 'working';
                    statusLabel = '上班中 🟢';
                    elapsedWorkSec = currentSec - startSec;
                }
            }

            currentEarned = elapsedWorkSec * ratePerSec;
            
            // 更新跳動畫面
            document.getElementById('displayEarnings').innerText = `HK$${currentEarned.toFixed(2)}`;
            document.getElementById('displaySubTime').innerText = `自 ${config.startTime} 起`;

            // 更新 Pill 標籤
            const pill = document.getElementById('statusPill');
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');

            pill.className = `status-pill ${status}`;
            text.innerText = statusLabel;
            if (status === 'working') dot.innerText = '🟢';
            else if (status === 'lunch') dot.innerText = '🍱';
            else dot.innerText = '🏖️';

            // 即時淨賺
            const totalExp = todayExpenses.reduce((sum, e) => sum + e.amt, 0);
            const netEarned = currentEarned - totalExp;
            document.getElementById('netEarningsText').innerText = `淨賺: HK$${netEarned.toFixed(1)}`;
        }

        // ☕ 快捷記帳功能 (包含支付方式)
        function addQuickExpense() {
            const reason = document.getElementById('expReason').value || '返工消費';
            const amt = parseFloat(document.getElementById('expAmt').value);
            const method = document.getElementById('expMethod').value;
            if (!amt) return;

            todayExpenses.push({ reason, amt, method, time: new Date().toLocaleTimeString() });
            localStorage.setItem('WorkTimePay_TodayExpenses', JSON.stringify(todayExpenses));

            document.getElementById('expReason').value = '';
            document.getElementById('expAmt').value = '';
            renderExpenses();
        }

        function renderExpenses() {
            const list = document.getElementById('expenseList');
            list.innerHTML = '';
            todayExpenses.forEach(e => {
                const methodTag = e.method ? `<span class="pay-tag">${e.method}</span>` : '';
                list.innerHTML += `<div class="expense-item"><span>${e.reason} ${methodTag}</span><span style="color:var(--danger-color)">-$${e.amt}</span></div>`;
            });
        }

        // 📤 匯出至《記數易》格式 (CSV) - 包含支付方式標記
        function exportToAccEasyCSV() {
            const todayStr = new Date().toISOString().split('T')[0];
            let csvContent = "\uFEFF內容,金額,日期\n";

            // 加入今日薪金
            if (currentEarned > 0) {
                csvContent += `工作薪金 (今日結算),${currentEarned.toFixed(1)},${todayStr}\n`;
            }

            // 加入今日返工消費 (把支付方式附在項目名稱後)
            todayExpenses.forEach(e => {
                const methodStr = e.method ? ` [${e.method}]` : '';
                csvContent += `[返工] ${e.reason}${methodStr},-${e.amt},${todayStr}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `開工計_匯出記數易_${todayStr}.csv`;
            link.click();
        }

        // 啟動主流程
        loadConfigToUI();
        renderExpenses();
        setInterval(updateCounter, 30);
        updateCounter();
    </script>
</body>
</html>
